<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Placeholder project icon: a sleepy space-trucker bunny. Swap freely. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1650"/>
      <stop offset="1" stop-color="#6a2c7e"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#sky)"/>
  <!-- stars -->
  <circle cx="20" cy="24" r="2.2" fill="#ffe9a8"/>
  <circle cx="106" cy="20" r="1.8" fill="#9ff3ff"/>
  <circle cx="112" cy="58" r="1.6" fill="#ffe9a8"/>
  <circle cx="16" cy="70" r="1.5" fill="#9ff3ff"/>
  <circle cx="94" cy="36" r="1.2" fill="#ffffff"/>
  <!-- ears (the right one flops over: long shift) -->
  <g transform="rotate(-10 48 52)">
    <ellipse cx="48" cy="34" rx="11" ry="27" fill="#f6eefc"/>
    <ellipse cx="48" cy="36" rx="5.5" ry="19" fill="#ff9ccf"/>
  </g>
  <g transform="rotate(33 80 60)">
    <ellipse cx="80" cy="36" rx="11" ry="26" fill="#f6eefc"/>
    <ellipse cx="80" cy="38" rx="5.5" ry="18" fill="#ff9ccf"/>
  </g>
  <!-- head -->
  <ellipse cx="64" cy="82" rx="33" ry="29" fill="#f6eefc"/>
  <!-- half-lidded, unimpressed eyes -->
  <path d="M44 78 h15" stroke="#2a1650" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M45.5 78 a6 5.5 0 0 0 12 0 z" fill="#2a1650"/>
  <path d="M69 78 h15" stroke="#2a1650" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M70.5 78 a6 5.5 0 0 0 12 0 z" fill="#2a1650"/>
  <!-- blush, nose, flat mouth -->
  <ellipse cx="42" cy="91" rx="6" ry="3.5" fill="#ffb3d9"/>
  <ellipse cx="86" cy="91" rx="6" ry="3.5" fill="#ffb3d9"/>
  <path d="M60 87 h8 l-4 4.5 z" fill="#ff7fb8"/>
  <path d="M59 98 h9" stroke="#2a1650" stroke-width="2.5" stroke-linecap="round"/>
  <!-- stalk of wheat, chewed thoughtfully -->
  <path d="M67 98 L96 112" stroke="#e8c26a" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="96" cy="112" rx="5" ry="2.6" fill="#f2d27a" transform="rotate(26 96 112)"/>
  <ellipse cx="91" cy="106.5" rx="4" ry="2.2" fill="#f2d27a" transform="rotate(-20 91 106.5)"/>
  <ellipse cx="88" cy="113.5" rx="4" ry="2.2" fill="#f2d27a" transform="rotate(60 88 113.5)"/>
</svg>
